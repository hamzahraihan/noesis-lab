name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run check:native
      - run: npm test
      - name: Update docs counts
        run: npm run update:docs-counts
      - name: Check for uncommitted docs changes
        run: |
          if ! git diff --quiet docs/ PRODUCT.md; then
            echo "❌ docs/ or PRODUCT.md out of sync with source counts"
            echo "Run 'npm run update:docs-counts' locally and commit the changes"
            git diff docs/ PRODUCT.md
            exit 1
          fi
