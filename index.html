<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The two families the design tokens name, loaded once here rather than by
      each page that renders them: one URL to update, discovered before the
      bundle runs, and `display=swap` keeps first paint off the critical path.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans:wght@400;500;600;700&display=swap"
    />
    <title>noesis-lab</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('noesis-theme');
          if (t === 'paper') document.documentElement.setAttribute('data-theme', 'paper');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
